<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Card Catalog - трекер задач</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2214%22 fill=%22%231b2430%22/><rect x=%2222%22 y=%2228%22 width=%2256%22 height=%2244%22 rx=%223%22 fill=%22%23eef1f6%22/><circle cx=%2232%22 cy=%2238%22 r=%223%22 fill=%22%231b2430%22/><rect x=%2222%22 y=%2250%22 width=%2256%22 height=%223%22 fill=%22%23c1443d%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow">Картотека задач</p>
        <h1>Card Catalog</h1>
      </div>
      <div class="count"><strong id="openCount">0</strong>в работе</div>
    </header>

    <form class="add" id="addForm">
      <input type="text" name="title" placeholder="Новая карточка — что нужно сделать?" required maxlength="200" />
      <select name="category">
        <option value="general">Общее</option>
        <option value="client">Клиент</option>
        <option value="design">Дизайн</option>
        <option value="dev">Разработка</option>
      </select>
      <button type="submit">Завести карточку</button>
    </form>

    <div class="drawer-label">В работе</div>
    <div class="cards" id="openCards"></div>

    <div class="drawer-label">Закрыто</div>
    <div class="cards" id="doneCards"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
